[project]
name = "fontaine"
version = "0.1.0"
description = "Online font recognition over a stream of text-box crops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.63.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.0",
]

[project.scripts]
fontaine = "fontaine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fontaine"]

[dependency-groups]
dev = ["pytest>=8.0"]
