[project]
name = "fontaine"
version = "0.1.0"
description = "Online font recognition over a stream of text-box crops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.63.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "river>=0.25.0",
    "typer>=0.27.0",
]

[project.scripts]
fontaine = "fontaine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fontaine"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
    "ty>=0.0.65",
]
models = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Presentation decks and their generator scripts are work products, not library code.
extend-exclude = [".data"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # pyupgrade — keep to modern syntax for the pinned Python
    "B",      # bugbear — likely bugs and questionable constructs
    "C4",     # comprehension rewrites
    "SIM",    # simplifications
    "RET",    # return-statement cleanups
    "PTH",    # prefer pathlib over os.path
    "PIE",    # misc lints
    "PERF",   # obvious performance traps
    "RUF",    # ruff's own rules
    "D",      # docstrings — this codebase explains its reasoning, so keep them honest
]
ignore = [
    "D100",   # module docstring: covered by D104/D103 where it matters
    "D104",   # package __init__ files are deliberately empty
    "D105",   # magic methods rarely need prose
    "D107",   # __init__ is documented on the class
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    # Accessors are documented as the noun they return ("The em size that renders
    # this face at ...") rather than as "Return the em size ...", which adds a
    # word without adding information.
    "D401",
    # The ambiguous characters here are the point: the charset presets need real
    # curly quotes and dashes as glyphs to test coverage against, and console
    # output uses × and → deliberately.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests read as prose already; their names say what they check.
"tests/*" = ["D101", "D102", "D103"]
# models/ is the challenger's own code. The framework holds itself to a docstring
# on every public thing; making someone's experiment pass that too is not the
# repo's business, and the class docstring shown by `fontaine models list` is the
# only one that has a reader.
"models/*" = ["D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.src]
include = ["src", "tests"]
