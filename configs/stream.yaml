# One stream, end to end. Relative paths resolve from the repo root.

# Base seed. Every item derives its own RNG from (seed, index), so item i is
# reproducible on its own without replaying the items before it.
seed: 0

fonts:
  font_dir: assets/fonts

  # Glyphs a face must have to enter the label space. Keep this to a core set:
  # the corpus intersects its alphabet with each face's real coverage, so a face
  # missing a few rare glyphs still contributes rather than being excluded.
  admission_charset: ascii_alnum

  exclude: []
  include_variable: false

# Which font each arriving item uses. Uniform over every font in the label space
# unless told otherwise — the overrides below are what make a stream an experiment
# rather than a draw.
arrival:
  # Weight carried by every font without a rule of its own. A font's probability is
  # its weight over the total of the fonts active at that point in the stream.
  default_weight: 1.0

  # Per-font overrides, keyed by face id (see `fontaine fonts scan`) or by a glob
  # over face ids. The most specific match wins: an exact id beats a glob, and a
  # longer glob beats a shorter one. A pattern matching nothing is an error, so a
  # renamed font cannot quietly turn this back into a uniform stream.
  #
  #   weight  how often it appears, relative to the others
  #   start   first item it may appear at — a new class arriving mid-stream
  #   stop    item it stops appearing at, exclusive — a class going away
  #
  # Worked example, commented out. Uncomment and adapt to your own fonts:
  #
  # fonts:
  #   "roboto:regular":  { weight: 5 }              # five times its fair share
  #   "oswald:*":        { weight: 0.2 }            # whole family made rare
  #   "lobster:regular": { start: 3000 }            # absent until item 3000
  #   "anton:regular":   { stop: 2000 }             # gone from item 2000 on
  #   "jetbrains-mono:regular": { weight: 0 }       # excluded entirely
  fonts: {}

render:
  # What the text says. Uncorrelated with the font by design — if words went with
  # fonts, a recognizer could read the words instead of the letterforms.
  corpus:
    kinds:
      word: 3.0
      phrase: 4.0
      sentence: 2.0
      number: 1.0
      price: 1.0
      date: 0.5
      time: 0.5
      token: 1.0
    words: [2, 5]
    casing:
      as_is: 4.0
      title: 3.0
      upper: 2.0
      lower: 1.0

  typography:
    # Height of the capital letters in pixels — the main knob for how big the text
    # comes out. Sizing by cap height rather than em size keeps apparent size
    # comparable across faces, so absolute scale cannot leak the label.
    #
    # Sampled log-uniformly, so the *median* is sqrt(lo * hi), not the midpoint:
    # [8, 44] puts half the crops under 19px and reads as pixelated, while
    # [18, 64] centres on 34px. Lower the floor to make the task harder — small
    # text is the hard regime — and raise it for crisper crops.
    cap_height_px: [18, 64]
    # Tracking as a fraction of cap height. Non-zero switches to a per-character
    # drawing path that loses ligatures, so v1 leaves it off.
    letter_spacing: [0.0, 0.0]

  background:
    # A weighted mixture, not a fallback chain: the synthetic sources keep their
    # share even when photo_dir is full. Only `photo` needs files, so it is the
    # only one that can drop out — and when it does the rest are renormalized.
    # These weights put photos on 60% of items and the six patterns on 40%.
    sources:
      photo: 6.0        # dropped and the rest renormalized if photo_dir is empty
      noise: 1.0        # grain at stroke scale, over a ramp
      blobs: 1.0        # soft multi-colour wash, the mesh-gradient look
      geometric: 0.75   # hard edges through the box — what forces a scrim
      gradient: 0.75    # linear ramp
      vignette: 0.25    # radial ramp
      solid: 0.25       # the easy floor, useful as a control
    photo_dir: assets/backgrounds
    # Patch size relative to the canvas before resampling to fit: above 1 zooms
    # out to finer texture, below 1 zooms in to smoother gradients.
    photo_scale: [0.5, 3.0]
    # Target WCAG contrast between the text and the background under it, held
    # against the harder end of the background's range rather than its mean.
    # 4.5 is the WCAG floor for body text; dropping it toward 2.0 is one of the
    # sharpest difficulty knobs there is, especially at small cap heights.
    contrast_ratio: [4.5, 16.0]
    dark_text_prob: 0.6
    saturated_prob: 0.25
    # A scrim is also forced regardless of this probability when the background
    # varies too much across the text box for one colour to stay legible.
    scrim_prob: 0.15
    scrim_opacity: [0.25, 0.8]
    min_contrast: 1.9

  crop:
    # Per-side padding around the tight ink box, in units of ink height, sampled
    # independently per side. Negative clips into the glyphs, as a too-tight
    # detector box does. This is not a degradation: crops from a text detector
    # are imprecise by nature, so it stays on even in v1.
    pad: [-0.04, 0.35]
    # A neighbouring line bleeding in at an edge. Off for v1.
    neighbor_bleed_prob: 0.0
    neighbor_gap: [0.15, 0.7]
