# Every asset a stream is generated from, pinned to an exact byte sequence.
#
# Why this file exists: generation is deterministic given (seed, config, assets),
# so two participants only get comparable scores from byte-identical assets. The
# checksums are the pin. The bytes themselves live on the release and are never
# committed — git is a poor store for 11 MB of fonts and photos that never change.
#
#   uv run fontaine assets fetch     download and verify everything below
#   uv run fontaine assets status    check what is on disk, no network
#   uv run fontaine assets hash      paste-ready entry for a file you added
#
# Adding or changing an asset is documented in AGENT.md, "Assets".

# The one address assets are fetched from, each named by its file name. A GitHub
# release serves its assets outside git history, so the bytes are versioned and
# downloadable without ever entering the repository.
#
# Deliberately the only source. An asset that could arrive from here *or* from
# its upstream project is an asset whose bytes depend on which one answered, and
# upstream projects re-generate their files.
release: https://github.com/mugulmd/fontaine/releases/download/assets-v1

# Seconds to wait on a stalled connection before giving up.
timeout: 30

assets:
  # ---------------------------------------------------------------------------
