  # ---------------------------------------------------------------------------
  # Backgrounds — photographs only, and optional. Removing one changes the pixels
  # but not the label space, so scores stay comparable in kind if not in value.
  #
  # Only photographs are pinned here. The synthetic canvases — noise, blobs,
  # geometric, gradient, vignette, solid — are functions in render/background.py,
  # drawn from each item's own RNG. They were files once; a checksum on a
  # procedurally generated image pins its output rather than its input, and four
  # fixed PNGs got cropped over and over where a function never repeats. A photo
  # is the opposite case: you cannot regenerate it from a seed, so pinning the
  # bytes is the only way to pin it at all.
  #
  # `license` here is the licence being *granted*, not one that had to be
  # obtained: you hold the copyright in a photo you took, but the release
  # redistributes these bytes to every participant, and with no statement the
  # default is all-rights-reserved. CC0-1.0 is the least friction.
  #
  # Four things copyright ownership does not cover, before a photo goes public:
  #   - strip EXIF *before* hashing — phone GPS and device serials go out with
  #     the release, and metadata is bytes, so removing it later breaks the pin;
  #   - no identifiable people (droit à l'image and GDPR are separate from
  #     copyright, and stronger in France);
  #   - nothing else copyrighted in frame — a poster or artwork carries its own
  #     rights, and France has no broad freedom-of-panorama exception;
  #   - no legible text in the photo. That one is technical, not legal: a second
  #     set of letterforms in the crop makes the item mislabelled rather than
  #     hard, since the label names only the font that drew the foreground.
  #
  # Textures — fabric, stone, paper, tile, painted walls — clear all four.
  # ---------------------------------------------------------------------------
